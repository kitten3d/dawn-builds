name: build-dawn

on:
  workflow_dispatch:
    inputs:
      dawn_tag:
        description: "Upstream Dawn release tag (e.g. v20260214.164635)"
        required: true
      dawn_commit:
        description: "Full Dawn commit sha for this release"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            suffix: linux-x86_64-Release
          - os: ubuntu-24.04-arm
            suffix: linux-arm64-Release
    # 24.04's gcc/glibc is the engine CI baseline; the arm runner has no -latest alias
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      DAWN_COMMIT: ${{ github.event.inputs.dawn_commit }}
      SUFFIX: ${{ matrix.suffix }}
    steps:
      - name: Free up disk space
        # runners ship ~14 GB free; the checkout + deps + Release objects crowd it
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libx11-dev libx11-xcb-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Clone and checkout Dawn
        run: |
          git clone https://dawn.googlesource.com/dawn
          cd dawn
          git checkout "${DAWN_COMMIT}"

      - name: Configure, build, and install Dawn
        working-directory: dawn
        run: |
          cmake -S . -B out/wayland -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DDAWN_FETCH_DEPENDENCIES=ON -DDAWN_ENABLE_INSTALL=ON \
            -DDAWN_BUILD_MONOLITHIC_LIBRARY=STATIC \
            -DDAWN_USE_WAYLAND=ON -DDAWN_USE_X11=ON -DDAWN_ENABLE_VULKAN=ON \
            -DDAWN_BUILD_SAMPLES=OFF -DDAWN_BUILD_TESTS=OFF \
            -DTINT_BUILD_TESTS=OFF -DTINT_BUILD_CMD_TOOLS=OFF \
            -DCMAKE_INSTALL_PREFIX=install
          cmake --build out/wayland --target webgpu_dawn -j
          cmake --install out/wayland

      - name: Stage install tree into the upstream layout
        # the consumer stripPrefix and cc_import select() key on this exact layout
        run: |
          PREFIX="Dawn-${DAWN_COMMIT}-${SUFFIX}"
          echo "PREFIX=${PREFIX}" >> "$GITHUB_ENV"
          rm -rf "${PREFIX}"
          mkdir -p "${PREFIX}"
          cp -a dawn/install/include "${PREFIX}/include"
          if [ -f dawn/install/lib64/libwebgpu_dawn.a ]; then
            cp -a dawn/install/lib64 "${PREFIX}/lib64"
          elif [ -f dawn/install/lib/libwebgpu_dawn.a ]; then
            mkdir -p "${PREFIX}/lib64"
            cp -a dawn/install/lib/libwebgpu_dawn.a "${PREFIX}/lib64/libwebgpu_dawn.a"
          else
            echo "::error::libwebgpu_dawn.a not found under dawn/install/{lib64,lib}"
            exit 1
          fi

      - name: Acceptance gate — Wayland + X11 surface support present
        # entry points resolve via vkGetInstanceProcAddr: string literals, not
        # linker symbols — strings, not nm
        run: |
          LIB="${PREFIX}/lib64/libwebgpu_dawn.a"
          for s in vkCreateWaylandSurfaceKHR vkCreateXlibSurfaceKHR; do
            if ! strings "${LIB}" | grep -qx "${s}"; then
              echo "::error::${LIB} is missing ${s}"
              exit 1
            fi
          done
          echo "Both Wayland and Xlib surface entry points present."

      - name: Acceptance gate — library size sanity
        run: |
          LIB="${PREFIX}/lib64/libwebgpu_dawn.a"
          bytes="$(stat -c%s "${LIB}")"
          echo "libwebgpu_dawn.a = ${bytes} bytes"
          if [ "${bytes}" -lt 20971520 ]; then
            echo "::error::${LIB} is ${bytes} bytes, under the 20 MB floor"
            exit 1
          fi

      - name: Package tarball
        run: |
          tar -czf "${PREFIX}.tar.gz" "${PREFIX}"

      - name: Acceptance gate — tarball prefix
        run: |
          bad="$(tar tf "${PREFIX}.tar.gz" | grep -v "^${PREFIX}/" || true)"
          if [ -n "${bad}" ]; then
            echo "::error::entries outside ${PREFIX}/ prefix:"
            echo "${bad}"
            exit 1
          fi
          echo "All entries under ${PREFIX}/."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PREFIX }}
          path: ${{ env.PREFIX }}.tar.gz

  # single job avoids the create-release race a per-matrix publish would have
  publish:
    needs: build
    runs-on: ubuntu-24.04
    env:
      DAWN_TAG: ${{ github.event.inputs.dawn_tag }}
      DAWN_COMMIT: ${{ github.event.inputs.dawn_commit }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # no checkout, so gh has no git context
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Compute and report sha256s
        run: |
          sha256sum Dawn-*.tar.gz | tee shas.txt
          {
            echo "## Dawn build artifacts"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| tag | \`${DAWN_TAG}\` |"
            echo "| commit | \`${DAWN_COMMIT}\` |"
            while read -r sha file; do
              echo "| \`${file}\` | \`${sha}\` |"
            done < shas.txt
            echo ""
            echo "Put these sha256s into \`module/extensions.bzl\` (_SHA256S, linux_* keys)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release and upload assets
        run: |
          NOTES="Wayland+X11-enabled static Dawn for Linux (x86-64 and arm64).

          - Dawn commit: \`${DAWN_COMMIT}\`
          - sha256s:
          \`\`\`
          $(cat shas.txt)
          \`\`\`

          Set the \`linux_*\` entries of \`_SHA256S\` in \`module/extensions.bzl\` to the values above."
          if gh release view "${DAWN_TAG}" >/dev/null 2>&1; then
            gh release edit "${DAWN_TAG}" --notes "${NOTES}"
          else
            gh release create "${DAWN_TAG}" --title "${DAWN_TAG}" --notes "${NOTES}"
          fi
          gh release upload "${DAWN_TAG}" Dawn-*.tar.gz --clobber
